# Starting config for exporting Llama 3.2 1B Instruct to ExecuTorch (XNNPACK, 8da4w).
# Fill in the three paths. Key names follow the ExecuTorch 1.x export_llm schema; check
# https://docs.pytorch.org/executorch/stable/llm/export-llm.html if your release rejects one.
base:
  model_class: llama3_2
  checkpoint: /path/to/Llama-3.2-1B-Instruct/original/consolidated.00.pth
  params: /path/to/Llama-3.2-1B-Instruct/original/params.json
  tokenizer_path: /path/to/Llama-3.2-1B-Instruct/original/tokenizer.model
  metadata: '{"get_bos_id":128000,"get_eos_ids":[128009,128001]}'
model:
  use_kv_cache: true
  use_sdpa_with_kv_cache: true
  dtype_override: fp32
export:
  max_seq_length: 1024
  max_context_length: 1024
  output_name: llama3_2_1b_8da4w.pte
quantization:
  qmode: 8da4w
  group_size: 32
  embedding_quantize: 4,32
backend:
  xnnpack:
    enabled: true
    extended_ops: true
